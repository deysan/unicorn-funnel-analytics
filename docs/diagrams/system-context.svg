<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Unicorn: архітектура MVP</title><desc id="desc">Один Worker і одна база D1 у Cloudflare Free. Cron і внутрішній імітатор працюють у тому самому Worker; таблиця імітатора розташована в тій самій D1. BigQuery — лише майбутній дизайн.</desc><defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#527a9b" stroke-width="1.4"/></marker><marker id="arrow-amberline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b68125" stroke-width="1.4"/></marker><marker id="arrow-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#727e8d" stroke-width="1.4"/></marker></defs><rect width="1600" height="1100" fill="#ffffff"/>
<text x="40" y="28" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="32" dominant-baseline="text-before-edge"><tspan x="40" dy="0">Unicorn · архітектура MVP</tspan></text>
<text x="40" y="78" fill="#476079" font-family="Helvetica, Arial, sans-serif" font-size="21" dominant-baseline="text-before-edge"><tspan x="40" dy="0">M0–M6 завершено · один Worker і одна D1 · стан на 2026-11-02</tspan></text>
<rect x="40" y="140" width="480" height="120" rx="12" fill="#ffffff" stroke="#6f97ba" stroke-width="2"/>
<rect x="560" y="140" width="480" height="120" rx="12" fill="#ffffff" stroke="#6f97ba" stroke-width="2"/>
<rect x="1080" y="140" width="480" height="120" rx="12" fill="#ffffff" stroke="#6f97ba" stroke-width="2"/>
<text x="60" y="155" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="24" dominant-baseline="text-before-edge"><tspan x="60" dy="0">Відвідувач · браузер</tspan></text>
<text x="60" y="192" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="19" dominant-baseline="text-before-edge"><tspan x="60" dy="0">Квіз → назва, URL і ClickID</tspan><tspan x="60" dy="23.75">HttpOnly cookie + X-Expected-User-ID</tspan></text>
<text x="580" y="155" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="24" dominant-baseline="text-before-edge"><tspan x="580" dy="0">Тестовий партнер · локальний CLI</tspan></text>
<text x="580" y="192" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="19" dominant-baseline="text-before-edge"><tspan x="580" dy="0">Lead / Purchase + ClickID</tspan><tspan x="580" dy="23.75">Окремий Bearer-секрет партнера</tspan></text>
<text x="1100" y="155" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="24" dominant-baseline="text-before-edge"><tspan x="1100" dy="0">Перевіряючий · браузер</tspan></text>
<text x="1100" y="192" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="19" dominant-baseline="text-before-edge"><tspan x="1100" dy="0">Бізнес-звіт і стан доставки</tspan><tspan x="1100" dy="23.75">Basic Auth · доступ лише для читання</tspan></text>
<rect x="40" y="305" width="1520" height="630" rx="12" fill="#f7fafc" stroke="#6f97ba" stroke-width="2"/>
<text x="455" y="315" fill="#476079" font-family="Helvetica, Arial, sans-serif" font-size="21" dominant-baseline="text-before-edge"><tspan x="455" dy="0">Cloudflare Free · синтетичне демо</tspan></text>
<rect x="70" y="365" width="300" height="115" rx="12" fill="#eaf4ff" stroke="#6f97ba" stroke-width="2"/>
<text x="90" y="380" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="23" dominant-baseline="text-before-edge"><tspan x="90" dy="0">Workers Static Assets</tspan></text>
<text x="90" y="417" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="90" dy="0">React + TypeScript + Vite</tspan><tspan x="90" dy="22.5">Статичні файли квізу та звіту</tspan></text>
<rect x="430" y="365" width="1100" height="385" rx="12" fill="#ffffff" stroke="#6f97ba" stroke-width="2"/>
<text x="455" y="376" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="25" dominant-baseline="text-before-edge"><tspan x="455" dy="0">Один Worker · Hono / TypeScript</tspan></text>
<text x="455" y="410" fill="#476079" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="455" dy="0">Модулі одного бекенду; маршрути захищені окремо</tspan></text>
