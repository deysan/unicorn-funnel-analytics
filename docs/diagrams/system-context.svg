<text x="470" y="463" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="21" dominant-baseline="text-before-edge"><tspan x="470" dy="0">Квіз і профіль</tspan></text>
<text x="470" y="495" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="17" dominant-baseline="text-before-edge"><tspan x="470" dy="0">Відповіді та події</tspan><tspan x="470" dy="21.25">Поточний профіль</tspan></text>
<text x="735" y="463" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="21" dominant-baseline="text-before-edge"><tspan x="735" dy="0">Офери й переходи</tspan></text>
<text x="735" y="495" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="17" dominant-baseline="text-before-edge"><tspan x="735" dy="0">Правила → ClickID</tspan><tspan x="735" dy="21.25">Каталог у Git / deploy</tspan></text>
<text x="1000" y="463" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="21" dominant-baseline="text-before-edge"><tspan x="1000" dy="0">Постбеки</tspan></text>
<text x="1000" y="495" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="17" dominant-baseline="text-before-edge"><tspan x="1000" dy="0">Авторизація, атрибуція</tspan><tspan x="1000" dy="21.25">Повтори Lead / Purchase</tspan></text>
<text x="1265" y="463" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="21" dominant-baseline="text-before-edge"><tspan x="1265" dy="0">Звіт</tspan></text>
<text x="1265" y="495" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="17" dominant-baseline="text-before-edge"><tspan x="1265" dy="0">Читання events із D1</tspan><tspan x="1265" dy="21.25">BigQuery не потрібен</tspan></text>
<path d="M 690,505 L 720,505" fill="none" stroke="#527a9b" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="70" y="515" width="300" height="235" rx="12" fill="#ffffff" stroke="#6f97ba" stroke-width="2"/>
<text x="90" y="530" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="23" dominant-baseline="text-before-edge"><tspan x="90" dy="0">Гарантії та межі</tspan></text>
<text x="90" y="568" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="90" dy="0">Успіх нової команди —</tspan><tspan x="90" dy="22.5">після надійного запису в D1.</tspan><tspan x="90" dy="22.5">Подія, бізнес-зміни й ключ</tspan><tspan x="90" dy="22.5">повтору — атомарно.</tspan><tspan x="90" dy="22.5"></tspan><tspan x="90" dy="22.5">Зовнішній перехід</tspan><tspan x="90" dy="22.5">у демо імітований.</tspan></text>
<rect x="455" y="600" width="520" height="120" rx="12" fill="#eaf4ff" stroke="#6f97ba" stroke-width="2"/>
<text x="472" y="612" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="21" dominant-baseline="text-before-edge"><tspan x="472" dy="0">Scheduled handler · Cron щохвилини</tspan></text>
<text x="472" y="646" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="472" dy="0">1. Claim до 10 подій у D1; lease на 2 хв</tspan><tspan x="472" dy="22.5">2. Передати пакет внутрішньому адаптеру</tspan><tspan x="472" dy="22.5">4. Застосувати ACK у D1 за чинним lease</tspan></text>
<rect x="1020" y="600" width="485" height="120" rx="12" fill="#fff4dc" stroke="#b68125" stroke-width="2"/>
<text x="1037" y="612" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="21" dominant-baseline="text-before-edge"><tspan x="1037" dy="0">Внутрішній імітатор приймача</tspan></text>
<text x="1037" y="646" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="1037" dy="0">3. Запис у mock_received_events цієї D1</tspan><tspan x="1037" dy="22.5">ACK за EventID; повтори не додають копій</tspan><tspan x="1037" dy="22.5">Запис приймача й ACK — різні транзакції</tspan></text>
<path d="M 975,638 L 1020,638" fill="none" stroke="#527a9b" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<path d="M 1020,700 L 975,700" fill="none" stroke="#b68125" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-amberline)"/>
<path d="M 800,750 L 800,800" fill="none" stroke="#527a9b" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<text x="818" y="765" fill="#476079" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="818" dy="0">SQL · надійний запис / читання</tspan></text>
<rect x="70" y="800" width="1460" height="110" rx="12" fill="#eaf4ff" stroke="#6f97ba" stroke-width="2"/>
<text x="90" y="812" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="24" dominant-baseline="text-before-edge"><tspan x="90" dy="0">D1 Free · одна база · primary binding · джерело MVP-звіту</tspan></text>
<text x="90" y="851" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="19" dominant-baseline="text-before-edge"><tspan x="90" dy="0">users · clicks · partner_events · user_offer_leads</tspan><tspan x="90" dy="23.75">events · request_results · event_delivery · capacity_control</tspan></text>
<rect x="1160" y="851" width="345" height="42" rx="12" fill="#fff4dc" stroke="#b68125" stroke-width="2"/>
<text x="1175" y="859" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="20" dominant-baseline="text-before-edge"><tspan x="1175" dy="0">mock_received_events</tspan></text>
<path d="M 950,720 L 950,735 L 1545,735 L 1545,1015 L 1530,1015" fill="none" stroke="#727e8d" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-future)"/>
<rect x="1035" y="975" width="495" height="90" rx="12" fill="#ffffff" stroke="#727e8d" stroke-width="2" stroke-dasharray="9 7"/>
<text x="1055" y="988" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="22" dominant-baseline="text-before-edge"><tspan x="1055" dy="0">BigQuery · лише майбутній дизайн</tspan></text>
<text x="1055" y="1023" fill="#476079" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="1055" dy="0">Заміна адаптера; у MVP не підключено</tspan></text>
<text x="40" y="965" fill="#476079" font-family="Helvetica, Arial, sans-serif" font-size="19" dominant-baseline="text-before-edge"><tspan x="40" dy="0">Синє — реалізовано · жовте — імітація · пунктир — майбутнє</tspan></text>
<text x="40" y="994" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="40" dy="0">Ліміти демо: 1 000 недоставлених · 10 000 подій · 1 000 профілів · 20 000 ключів</tspan></text>
<text x="40" y="1022" fill="#172b42" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="40" dy="0">Цілі: 12 млн подій/міс. · пік 200/с · p95 ≤ 500 мс (США). Не виміряно.</tspan></text>
<text x="40" y="1050" fill="#476079" font-family="Helvetica, Arial, sans-serif" font-size="18" dominant-baseline="text-before-edge"><tspan x="40" dy="0">MVP розгорнуто. Production-навантаження не перевірено.</tspan></text>
</svg>
