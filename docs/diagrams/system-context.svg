<rect x="455" y="450" width="235" height="110" rx="12" fill="#eaf4ff" stroke="#6f97ba" stroke-width="2"/>
<rect x="720" y="450" width="235" height="110" rx="12" fill="#eaf4ff" stroke="#6f97ba" stroke-width="2"/>
